name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_NAME: PP Studio
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_SITE_URL: https://ppstudio.cz
  NEXT_PUBLIC_MATOMO_ENABLED: "true"
  NEXT_PUBLIC_MATOMO_URL: https://matomo.example.test/
  NEXT_PUBLIC_MATOMO_SITE_ID: "1"
  NEXT_PUBLIC_META_PIXEL_ENABLED: "true"
  NEXT_PUBLIC_META_PIXEL_ID: "123456789"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ppstudio?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ppstudio_shadow?schema=public
  ADMIN_SESSION_SECRET: ci-secret-value-with-at-least-32-characters
  ADMIN_OWNER_EMAIL: owner@example.com
  ADMIN_OWNER_PASSWORD: change-me-owner
  ADMIN_STAFF_EMAIL: staff@example.com
  ADMIN_STAFF_PASSWORD: change-me-staff
  EMAIL_DELIVERY_MODE: log
  SMTP_FROM_NAME: PP Studio
  PLAYWRIGHT_PORT: 3100
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test release mechanism
        run: npm run test:release-script

      - name: Version consistency
        run: npm run version:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Email worker import smoke test
        run: npm run email:worker:check-imports

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppstudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:generate

      - name: Test unit layer with coverage and DB integrations
        run: npm run test:ci

      - name: Test production security headers
        run: NODE_ENV=production node --import ./src/test/register-server-only.mjs --import tsx --test src/config/security-headers.test.ts

      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppstudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:generate

      - name: Build
        timeout-minutes: 10
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppstudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        timeout-minutes: 10
        run: npm run build

      - name: E2E Chromium (shard 1/2)
        run: npx playwright test --fully-parallel --project=chromium --shard=1/2

      - name: Upload Playwright report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-shard-1
          path: playwright-report/
          retention-days: 14

  e2e-chromium-shard-2:
